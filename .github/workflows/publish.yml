name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, such as v0.1.0-alpha.6
        required: true
        type: string

concurrency:
  group: npm-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate source and package
        run: |
          bun run build:ui
          bun run lint
          bun run typecheck
          bun test
          node --test scripts/release-check.test.mjs scripts/npm-version-status.test.mjs
          node scripts/release-check.mjs --tag "$RELEASE_TAG"
          npm pack --dry-run

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check npm registry
        id: registry
        run: >-
          node scripts/npm-version-status.mjs
          --package "${{ steps.metadata.outputs.package }}"
          --version "${{ steps.metadata.outputs.version }}"

      - name: Configure npm authentication
        if: steps.registry.outputs.published != 'true'
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            NPMRC="$RUNNER_TEMP/superswarm.npmrc"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$NPMRC"
            echo "NPM_CONFIG_USERCONFIG=$NPMRC" >> "$GITHUB_ENV"
            npm whoami
          else
            echo "NPM_TOKEN is not set; npm trusted publishing will be used."
          fi

      - name: Publish package
        if: steps.registry.outputs.published != 'true'
        run: >-
          npm publish
          --access public
          --provenance
          --tag "${{ steps.metadata.outputs.dist-tag }}"

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ steps.metadata.outputs.version }}"
          awk '/^## \['"$VERSION"'\]/{found=1; next} found && /^## \[/{exit} found{print}' \
            CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "No release notes found for $VERSION" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
